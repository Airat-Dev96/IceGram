import groovy.json.JsonOutput
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream

// Diagnostics only: export external dependency coordinates and consumer rules.
// Never export program jars, BuildConfig, API_KEYS, Firebase config or keys.
def isRule = { String name ->
    name == 'proguard.txt' ||
            (name.startsWith('META-INF/proguard/') && name.endsWith('.pro')) ||
            (name.startsWith('META-INF/com.android.tools/') && name.endsWith('.pro'))
}

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':TMessagesProj')
    ['Arm64', 'Armv7'].each { abi ->
        app.tasks.register("icegramR8${abi}Report") {
            group = 'verification'
            description = 'Export external consumer rules without compiling the application.'
            doLast {
                def config = app.configurations.getByName("full${abi}ReleaseRuntimeClasspath")
                def dependencies = []
                config.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    if (artifact.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                        def id = artifact.moduleVersion.id
                        def rules = []
                        if (artifact.file.name.endsWith('.aar') || artifact.file.name.endsWith('.jar')) {
                            new ZipFile(artifact.file).withCloseable { archive ->
                                archive.entries().each { entry ->
                                    if (!entry.directory && isRule(entry.name)) {
                                        rules.add([path: entry.name, text: archive.getInputStream(entry).getText('UTF-8')])
                                    } else if (entry.name == 'classes.jar') {
                                        new ZipInputStream(archive.getInputStream(entry)).withCloseable { jar ->
                                            def nested
                                            while ((nested = jar.nextEntry) != null) {
                                                if (!nested.directory && isRule(nested.name)) {
                                                    // Do not close the ZipInputStream between entries.
                                                    rules.add([path: 'classes.jar!/' + nested.name,
                                                               text: new String(jar.readAllBytes(), 'UTF-8')])
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        dependencies.add([id: "${id.group}:${id.name}:${id.version}", rules: rules])
                    }
                }
                def output = app.rootProject.layout.buildDirectory.file('icegram-r8/dependency-rules.json').get().asFile
                output.parentFile.mkdirs()
                output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                        abi: abi.toLowerCase(),
                        note: 'Dependency rules only; no APK was built or tested by this task.',
                        dependencies: dependencies.sort { it.id }
                ])) + '\n'
                println "External consumer-rule report: ${output}"
            }
        }
    }
}
